[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcopt"
version = "0.1.0"
description = "Differentiable computational quasiconformal research prototype"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "matplotlib", "scikit-image", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
